[bar.default]
capsule = true
end = [
    "tray",
    "notifications",
    "notes",
    "clipboard",
    "group:g1",
    "group:g2",
    "control-center",
    "session",
]
margin_ends = 0
padding = 28
radius = 0
widget_spacing = 12

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "surface_variant"
id = "g1"
members = ["cpu", "network", "bluetooth"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "surface_variant"
id = "g2"
members = ["brightness", "volume", "battery"]
opacity = 1.0
padding = 6.0

[calendar]
enabled = true

[desktop_widgets]
schema_version = 2
widget_order = [
    "desktop-widget-0000000000000001",
    "desktop-widget-0000000000000002",
]

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[desktop_widgets.widget.desktop-widget-0000000000000001]
box_height = 96.0
box_width = 368.0
cx = 192.0
cy = 1020.0
output = "Virtual-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "weather"

[desktop_widgets.widget.desktop-widget-0000000000000002]
box_height = 0.0
box_width = 0.0
cx = 1596.0
cy = 857.0
output = "Virtual-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "calendar"

[location]
address = "Amsterdam"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@Virtual-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
box_height = 196.0
box_width = 810.0
cx = 960.0
cy = 898.0
output = "Virtual-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[plugins]
enabled = ["noctalia/notes"]

[shell]
app_icon_colorize = true
corner_radius_scale = 0.0
panel_anchor_bar = "default"
polkit_agent = true

[shell.screen_corners]
size = 1

[theme]
community_palette = "Osaka jade"
mode = "dark"
source = "community"

[theme.templates]
builtin_ids = ["foot", "gtk3", "gtk4", "hyprland", "qt"]
community_ids = [
    "discord",
    "gimp",
    "hyprtoolkit",
    "inkscape",
    "lazygit",
    "libreoffice",
    "neovim",
    "pywalfox-beta4",
    "pywalfox",
    "steam",
    "tmux",
    "vscode",
]

[wallpaper]
directory = "/home/neal/.config/themes/osaka-jade/backgrounds"

[wallpaper.automation]
enabled = true
interval_seconds = 3600

[wallpaper.default]
path = "/home/neal/.config/themes/osaka-jade/backgrounds/osaka-jade-bg-2.jpg"

[wallpaper.last]
path = "/home/neal/.config/themes/osaka-jade/backgrounds/osaka-jade-bg-2.jpg"

[widget.network]
show_label = false
show_vpn_label = true

[widget.notes]
type = "noctalia/notes:notes"
