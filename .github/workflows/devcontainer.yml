name: Devcontainer

on:
  push:
    tags:
      - devcontainer-v*
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nvveen/nealos-devcontainer:latest

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --progress=plain --file hosts/devcontainer/Dockerfile --tag "$IMAGE" .
      - name: Check image
        run: docker run --rm "$IMAGE" nix --version
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/devcontainer-v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version
        if: startsWith(github.ref, 'refs/tags/devcontainer-v')
        run: |
          docker tag "$IMAGE" "${IMAGE%:latest}:${GITHUB_REF_NAME#devcontainer-}"
          docker push "${IMAGE%:latest}:${GITHUB_REF_NAME#devcontainer-}"
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/devcontainer-v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: docker push "$IMAGE"