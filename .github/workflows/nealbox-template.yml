name: nealbox-template

on:
  # Manual only; trigger with `gh workflow run nealbox-template.yml`
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Stamp the run number into the version so each publish is a new version.
      - name: Set template version
        run: |
          f=.devcontainer/templates/nealbox/devcontainer-template.json
          jq '.version = "1.0.${{ github.run_number }}"' "$f" > "$f.tmp" && mv "$f.tmp" "$f"

      # Publishes the template directories under the configured base path.
      - uses: devcontainers/action@v1
        with:
          publish-templates: "true"
          base-path-to-templates: ./.devcontainer/templates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}