name: nealbox

on:
  # manual only; trigger with `gh workflow run nealbox.yml`
  workflow_dispatch:

# A newer run cancels an in-progress build.
concurrency:
  group: nealbox
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # buildx is required for the GitHub Actions layer cache.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hosts/nealbox/Dockerfile
          push: true
          tags: |
            ghcr.io/nvveen/nealbox:latest
            ghcr.io/nvveen/nealbox:${{ github.sha }}
          # Reuse unchanged layers (apt, Nix install) between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max